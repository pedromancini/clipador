# Análise de VOD: depois da live, acha os melhores momentos (chat + clips do público + IA) e gera os clips.
# Os clips ficam no artifact "clips-vod-..." (o baixar_clips_tiktok.bat pega eles também).
# Teste: NÃO posta no YouTube (dá pra postar depois com o "postar clips prontos", lista=auto).
name: analisar VOD

on:
  # campeonatos: 2x por dia analisa a última live encerrada de cada streamer (pula a que já foi feita)
  schedule:
    - cron: "0 13 * * *"   # 10h de Brasília
    - cron: "0 22 * * *"   # 19h de Brasília
  workflow_dispatch:
    inputs:
      canais:
        description: "plataforma/canal separados por vírgula (ex.: twitch/alanzoka,kick/bistecone)"
        required: true
        default: "twitch/alanzoka"
      vod:
        description: "Só com 1 canal: id/link da VOD (vazio = a última live encerrada)"
        required: false
        default: ""
      max:
        description: "Quantos clips finais por streamer"
        required: false
        default: "15"
      candidatos:
        description: "Quantos momentos a IA analisa por streamer"
        required: false
        default: "30"
      postar:
        description: "No fim, postar os melhores no YouTube (só streamers liberados, no ritmo do canal)"
        type: boolean
        default: false
      so_gameplay:
        description: "Só gameplay (descarta conversa/IRL em todos os canais)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # dispara o postador do YouTube no fim

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      canais: ${{ steps.m.outputs.canais }}
    steps:
      - id: m
        env:
          CANAIS: ${{ inputs.canais || 'kick/allanstag,kick/orenatovicente,twitch/kaicenat' }}
        run: |
          python3 -c "import json,os; print('canais='+json.dumps([c.strip() for c in os.environ['CANAIS'].split(',') if c.strip()]))" >> "$GITHUB_OUTPUT"

  analisar:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        canal: ${{ fromJSON(needs.setup.outputs.canais) }}
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLIPADOR_MODEL_DIR: /home/runner/.cache/clipador/whisper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências Python
        run: pip install -r requirements.txt yt-dlp

      - name: Instalar ffmpeg (build pronto, sem apt)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -hide_banner -version | head -1

      - name: Demucs (tirar a música), só se o streamer usa
        env:
          CANAL_REF: ${{ matrix.canal }}
        run: |
          if python -c "import sys; from clipador.config import load_config, parse_channel_ref; p, n = parse_channel_ref(sys.argv[1]); sys.exit(0 if load_config().channel_or_default(p, n).tirar_musica else 1)" "$CANAL_REF"; then
            pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q demucs==4.0.1
          fi

      - name: Cache do modelo do Demucs
        uses: actions/cache@v6
        with:
          path: ~/.cache/torch
          key: demucs-htdemucs-v1

      - name: Cache do modelo Whisper
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/clipador/whisper
          key: whisper-${{ hashFiles('channels.json') }}
          restore-keys: whisper-

      - id: nome
        env:
          CANAL: ${{ matrix.canal }}
        run: echo "slug=$(echo "$CANAL" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: VODs já analisadas deste streamer (das execuções anteriores)
        uses: actions/cache@v6
        with:
          path: state
          key: vods-${{ steps.nome.outputs.slug }}-${{ github.run_id }}
          restore-keys: vods-${{ steps.nome.outputs.slug }}-

      - name: Analisar a VOD e gerar os clips
        env:
          CANAL: ${{ matrix.canal }}
          VOD: ${{ inputs.vod }}
          MAX: ${{ inputs.max || '20' }}
          CAND: ${{ inputs.candidatos || '30' }}
          SO_GAMEPLAY: ${{ inputs.so_gameplay && '--so-gameplay' || '' }}
          PULAR: ${{ github.event_name == 'schedule' && '--pular-feitos' || '' }}
          CLIPADOR_STATE_DIR: state
        run: python -m clipador.vod_analise --canal "$CANAL" --vod "$VOD" --max "$MAX" --candidatos "$CAND" $SO_GAMEPLAY $PULAR

      - name: Clips (artifact, 3 dias)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clips-vod-${{ steps.nome.outputs.slug }}-${{ github.run_id }}
          path: |
            clips/*.mp4
            clips/*.json
            clips/*.md
          retention-days: 3
          if-no-files-found: ignore

  # Postagem automática: os melhores clips do dia vão pro YouTube (só streamers com "youtube" ligado,
  # no ritmo de cada canal: espaçados, respeitando o teto de 24h; o postador espera e se re-dispara).
  postar:
    needs: analisar
    if: always() && (github.event_name == 'schedule' || inputs.postar)
    runs-on: ubuntu-24.04
    steps:
      - name: Disparar o postador do YouTube
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run postar_clips.yml -R "${{ github.repository }}"             -f run_id="${{ github.run_id }}" -f lista=auto -f intervalo=150 -f max=4 -f esperar_limite=true
