# Análise de VOD: depois da live, acha os melhores momentos (chat + clips do público + IA) e gera os clips.
# Os clips ficam no artifact "clips-vod-..." (o baixar_clips_tiktok.bat pega eles também).
# Teste: NÃO posta no YouTube (dá pra postar depois com o "postar clips prontos", lista=auto).
name: analisar VOD

on:
  workflow_dispatch:
    inputs:
      canais:
        description: "plataforma/canal separados por vírgula (ex.: twitch/alanzoka,kick/bistecone)"
        required: true
        default: "twitch/alanzoka"
      vod:
        description: "Só com 1 canal: id/link da VOD (vazio = a última live encerrada)"
        required: false
        default: ""
      max:
        description: "Quantos clips finais por streamer"
        required: false
        default: "15"
      candidatos:
        description: "Quantos momentos a IA analisa por streamer"
        required: false
        default: "30"
      so_gameplay:
        description: "Só gameplay (descarta conversa/IRL em todos os canais)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      canais: ${{ steps.m.outputs.canais }}
    steps:
      - id: m
        env:
          CANAIS: ${{ inputs.canais }}
        run: |
          python3 -c "import json,os; print('canais='+json.dumps([c.strip() for c in os.environ['CANAIS'].split(',') if c.strip()]))" >> "$GITHUB_OUTPUT"

  analisar:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        canal: ${{ fromJSON(needs.setup.outputs.canais) }}
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLIPADOR_MODEL_DIR: /home/runner/.cache/clipador/whisper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências Python
        run: pip install -r requirements.txt yt-dlp

      - name: Instalar ffmpeg (build pronto, sem apt)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -hide_banner -version | head -1

      - name: Cache do modelo Whisper
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/clipador/whisper
          key: whisper-${{ hashFiles('channels.json') }}
          restore-keys: whisper-

      - id: nome
        env:
          CANAL: ${{ matrix.canal }}
        run: echo "slug=$(echo "$CANAL" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Analisar a VOD e gerar os clips
        env:
          CANAL: ${{ matrix.canal }}
          VOD: ${{ inputs.vod }}
          MAX: ${{ inputs.max }}
          CAND: ${{ inputs.candidatos }}
          SO_GAMEPLAY: ${{ inputs.so_gameplay && '--so-gameplay' || '' }}
        run: python -m clipador.vod_analise --canal "$CANAL" --vod "$VOD" --max "$MAX" --candidatos "$CAND" $SO_GAMEPLAY

      - name: Clips (artifact, 3 dias)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clips-vod-${{ steps.nome.outputs.slug }}-${{ github.run_id }}
          path: |
            clips/*.mp4
            clips/*.json
            clips/*.md
          retention-days: 3
          if-no-files-found: ignore
