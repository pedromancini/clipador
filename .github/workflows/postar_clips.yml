# Posta no YouTube clips JÁ PRONTOS de uma execução anterior (pega do artifact daquela execução).
# Disparo manual: Actions -> "postar clips prontos" -> Run workflow.
# Os posts não contam no limite de 2/h da live (marca "clipador:extra/<canal>").
name: postar clips prontos

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução do clipador que gerou os clips (artifact ainda válido, 3 dias)"
        required: true
      lista:
        description: 'auto (os não postados, mais virais primeiro) ou JSON: [{"arquivo": "...mp4", "titulo": "...", "legenda": "...", "hashtags": ["#x"]}]'
        required: true
      intervalo:
        description: "Minutos entre um post e outro"
        default: "20"
      max:
        description: "Com lista=auto: quantos postar (0 = todos)"
        default: "0"
      esperar_limite:
        description: "Se o canal estiver no limite de envios, esperar liberar (e se re-disparar se precisar)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # para se re-disparar com o que faltou postar

jobs:
  postar:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_REFRESH_TOKEN_DANTE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DANTE }}   # canal @dantecllips
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Baixar os clips da execução
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          # pega os artifacts dessa execução em qualquer tentativa (re-run cancelado não esconde o clip)
          mkdir -p baixados clips
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"                         -q ".artifacts[] | select(.workflow_run.id == $RUN_ID and (.expired | not)) | .id"); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "baixados/$id.zip"
            unzip -o -q "baixados/$id.zip" -d baixados
          done
          find baixados \( -name '*.mp4' -o -name '*.json' \) -exec mv {} clips/ \;
          ls clips

      - name: Postar
        env:
          LISTA: ${{ inputs.lista }}
          INTERVALO: ${{ inputs.intervalo }}
          ESPERAR: ${{ inputs.esperar_limite && '--esperar-limite' || '' }}
          MAX: ${{ inputs.max || '0' }}
        run: |
          printf '%s' "$LISTA" > lista.json
          python -m clipador.postar_lote --dir clips --lista lista.json --intervalo "$INTERVALO" --max "$MAX" $ESPERAR

      - name: Faltou postar? Dispara de novo com o resto
        if: hashFiles('restantes.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          INTERVALO: ${{ inputs.intervalo }}
        run: gh workflow run postar_clips.yml --ref ${{ github.ref_name }} -f run_id="$RUN_ID" -f intervalo="$INTERVALO" -f esperar_limite=true -f lista="$(cat restantes.json)"
